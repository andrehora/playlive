<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post composer</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#0f766e}</style>
</head>
<body>
<h1>New post</h1>
<label for="post">Your post</label><textarea id="post" placeholder="What's happening?"></textarea>
<p id="count">50 characters left</p>
<button id="publish" type="button" disabled>Post</button>
<p id="ok" class="ok" hidden></p>
<h2>Your posts</h2><ul id="posts" class="clean"><li id="none">Nothing posted yet.</li></ul>

<script>
const LIMIT=50;
function upd(){const n=$('post').value.length,left=LIMIT-n;
  $('count').textContent=left>=0?left+(left===1?' character left':' characters left'):'Too long by '+(-left)+(left===-1?' character':' characters');
  $('count').style.color=left<0?'#b91c1c':'';$('publish').disabled=!$('post').value.trim()||left<0;}
$('post').addEventListener('input',upd);
$('publish').onclick=()=>{const li=document.createElement('li');li.textContent=$('post').value.trim();$('posts').prepend(li);
  const none=$('none');if(none)none.remove();$('post').value='';upd();$('ok').hidden=false;$('ok').textContent='Posted!';};
</script>
</body>
</html>
