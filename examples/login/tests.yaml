vars:
  email: ana@northwind.test
  password: secret123
beforeEach:
  - fill: { label: Email, value: "${email}" }
  - fill: { label: Password, value: "${password}" }
  - click: { role: button, name: Log in }

test: Wrong password shows an error
vars:
  password: wrong-password
steps:
  - expectText: Wrong email or password.
  - expectNoText: Welcome back

test: Valid login opens the dashboard
steps:
  - expectText: "Welcome back, ana"
  - expectText: You have 3 new invoices.

test: Log out returns to the login form
steps:
  - click: { role: button, name: Log out }
  - expectVisible: { role: button, name: Log in }
