site: theme-settings

test: Switches to the dark theme
steps:
  - check: { label: Dark }
  - expectText: "Preview: Dark theme, medium text"

test: Changes the text size
steps:
  - select: { label: Text size, value: Large }
  - expectText: "Preview: Light theme, large text"

test: Resets to the defaults
steps:
  - check: { label: System }
  - select: { label: Text size, value: Small }
  - click: { role: button, name: Reset to defaults }
  - expectText: "Preview: Light theme, medium text"
