test: A degraded service shows at the top
steps:
  - expectText: 1 service having trouble
  - expectText: "API · Degraded"

test: Only problems hides the healthy services
steps:
  - select: { label: Show, value: Only problems }
  - expectText: "API · Degraded"
  - expectNoText: "Website · Operational"

test: Resolving the incident clears the page
steps:
  - click: { role: button, name: Mark incident resolved }
  - expectText: Incident resolved. Thanks for your patience.
  - expectText: All services operational
  - expectText: "API · Operational"

test: With nothing wrong the filter says so
steps:
  - click: { role: button, name: Mark incident resolved }
  - select: { label: Show, value: Only problems }
  - expectText: Nothing is having trouble.

# Deliberately smelly: Smells mode's example of Assertion Roulette. Six checks
# in a row, none of which says why it is there; when one goes red you are left
# reading the list to work out which claim mattered.
test: Reads the whole page in one go
steps:
  - expectText: 1 service having trouble
  - expectText: "Website · Operational"
  - expectText: "API · Degraded"
  - expectText: "Email delivery · Operational"
  - expectText: "Dashboards · Operational"
  - expectVisible: { role: button, name: Mark incident resolved }
