vars:
  name: Ana Souza
  email: ana@orbit.test
beforeEach:
  - fill: { label: Full name, value: "${name}" }
  - fill: { label: Email, value: "${email}" }
  - click: { role: button, name: Next }

test: Step 1 needs a valid email
vars:
  email: ana-at-orbit
steps:
  - expectText: Enter your name and a valid email.

test: Terms must be accepted
steps:
  - click: { role: button, name: Next }
  - expectText: Please accept the terms.

test: Sign up for the Pro plan
steps:
  - select: { label: Plan, value: Pro }
  - check: { label: I accept the terms }
  - click: { role: button, name: Next }
  - expectText: "Plan: Pro"
  - click: { role: button, name: Create account }
  - expectText: "Account created for Ana Souza!"
