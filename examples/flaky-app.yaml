site: flaky-app
# Every test below is flaky on purpose. Set Repeat to 5x and run them.
# The comments explain each cause and how to fix it.

test: Page loads
steps:
  - expectText: Flaky app

# CAUSE: slow server. The report takes 0.3 to 6 seconds, a step waits 4.
# FIX: give the step more time by adding "timeout: 8000" under it.
test: Report loads
steps:
  - click: { role: button, name: Load report }
  - expectText: "Report ready: 42 orders"

# CAUSE: random content. The tip changes on every visit.
# FIX: check only the stable part, e.g. - expectText: Tip of the day
test: Shows the coffee tip
steps:
  - expectText: "Tip of the day: Drink more coffee"

# CAUSE: the app is unreliable. Sync fails about 1 time in 3.
# FIX: none in the test. The test is right and found a real bug.
test: Sync succeeds
steps:
  - click: { role: button, name: Sync now }
  - expectText: Synced just now

# CAUSE: leftover data. The email is saved, so only the first run passes.
# FIX: use a new email every run: value: ana+${unique}@example.test
test: Join the waitlist
steps:
  - fill: { label: Email, value: ana@example.test }
  - click: { role: button, name: Join waitlist }
  - expectText: "You're on the waitlist"
