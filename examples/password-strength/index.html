<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password strength</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#0f766e}</style>
</head>
<body>
<h1>Choose a password</h1>
<label for="pw">New password</label><input id="pw" type="password">
<p id="meter" aria-live="polite">Strength: none</p>
<ul class="clean"><li id="h1">At least 8 characters</li><li id="h2">Contains a number</li><li id="h3">Contains a symbol</li></ul>

<script>
const rules=['At least 8 characters','Contains a number','Contains a symbol'];
$('pw').addEventListener('input',()=>{const v=$('pw').value;
  const ok=[v.length>=8,/[0-9]/.test(v),/[^A-Za-z0-9]/.test(v)];
  ok.forEach((c,i)=>{$('h'+(i+1)).textContent=(c?'✓ ':'')+rules[i];});
  const n=ok.filter(Boolean).length;
  $('meter').textContent='Strength: '+(v?['Weak','Weak','Medium','Strong'][n]:'none');});
</script>
</body>
</html>
