site: weather-widget

test: Shows the default city
steps:
  - expectText: "Lisbon now: 21°C, sunny"

test: Another city in Fahrenheit
steps:
  - select: { label: City, value: Oslo }
  - click: { role: button, name: Fahrenheit }
  - expectText: "Oslo now: 39°F, snow"

test: Shows the forecast
steps:
  - select: { label: City, value: Tokyo }
  - expectText: Wed · 17°C · rain
