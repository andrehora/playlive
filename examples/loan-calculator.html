<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loan calculator</title>
<script src="hooks.js"></script>
<link rel="stylesheet" href="site.css">
<style>:root{--accent:#0e7490}</style>
</head>
<body>
<h1>Loan calculator</h1>
<label for="amt">Loan amount</label><input id="amt" inputmode="decimal">
<label for="rate">Interest rate (%)</label><input id="rate" inputmode="decimal">
<label for="yrs">Term</label><select id="yrs"><option>15 years</option><option>20 years</option><option selected>30 years</option></select>
<button id="calc" type="button">Calculate</button><p id="err" role="alert"></p><p id="out" class="ok" hidden></p>

<script>
$('calc').onclick=()=>{const P=Number($('amt').value),r=Number($('rate').value)/100/12,n=parseInt($('yrs').value,10)*12;$('out').hidden=true;
  if(!(P>0)){$('err').textContent='Enter a loan amount.';return;}
  if($('rate').value===''||!(r>=0)){$('err').textContent='Enter an interest rate.';return;}
  $('err').textContent='';const m=r===0?P/n:P*r/(1-Math.pow(1+r,-n));
  const f=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  $('out').hidden=false;$('out').textContent='Monthly payment: $'+f(m)+' · Total paid: $'+f(m*n);};
</script>
</body>
</html>
