<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Message list</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#4338ca}</style>
</head>
<body>
<h1>Inbox</h1>
<p id="unread">Unread: 3</p>
<ul id="list" class="clean"></ul>
<button id="all" type="button">Mark all read</button>
<p id="opened" class="ok" hidden></p>

<script>
const msgs=[['Invoice #4821','Billing'],['Standup notes','Dana'],['Welcome aboard','People team']];
const read=new Set();
function upd(){
  $('unread').textContent='Unread: '+(msgs.length-read.size);
  $('list').textContent='';
  msgs.forEach(([s,f],i)=>{
    const li=document.createElement('li');
    const info=document.createElement('span');
    info.textContent=s+' · '+f+' · '+(read.has(i)?'read':'new');
    const b=document.createElement('button');b.type='button';b.textContent='Open';
    b.setAttribute('aria-label','Open '+s);
    b.onclick=()=>{read.add(i);$('opened').hidden=false;$('opened').textContent='Reading: '+s;upd();};
    li.append(info,b);$('list').appendChild(li);
  });
}
$('all').onclick=()=>{msgs.forEach((_,i)=>read.add(i));upd();};
upd();
</script>
</body>
</html>
