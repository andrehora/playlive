<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cookie consent</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#1d4ed8}</style>
</head>
<body>
<h1>Daily news</h1><p>Today's top stories, updated every hour.</p>
<p id="prefs">Cookie preferences: not chosen yet</p>
<button id="change" type="button" class="secondary">Change cookie settings</button>
<div id="banner" role="dialog" aria-label="Cookie consent" class="card">
  <p>We use cookies to understand how the site is used.</p>
  <button id="accept" type="button">Accept all</button> <button id="reject" type="button" class="secondary">Reject all</button> <button id="custom" type="button" class="secondary">Customize</button>
  <div id="choices" hidden>
    <label class="inline"><input type="checkbox" id="an"> Analytics</label>
    <label class="inline"><input type="checkbox" id="mk"> Marketing</label>
    <button id="savePrefs" type="button">Save preferences</button>
  </div>
</div>

<script>
function set(a,m){$('prefs').textContent='Cookie preferences: analytics '+(a?'on':'off')+', marketing '+(m?'on':'off');$('banner').hidden=true;$('choices').hidden=true;}
$('accept').onclick=()=>set(true,true);$('reject').onclick=()=>set(false,false);
$('custom').onclick=()=>{$('choices').hidden=false;};
$('savePrefs').onclick=()=>set($('an').checked,$('mk').checked);
$('change').onclick=()=>{$('banner').hidden=false;};
</script>
</body>
</html>
