<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm dialog</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#be185d}</style>
</head>
<body>
<h1>Projects</h1>
<ul class="clean"><li id="proj"><span>Website redesign</span><button id="del" type="button" class="secondary">Delete project</button></li></ul>
<p id="empty" hidden>No projects.</p><p id="msg" role="status"></p>
<div id="overlay" class="overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dt">
  <h2 id="dt">Delete “Website redesign”?</h2><p>This can't be undone.</p>
  <button id="cancel" type="button" class="secondary">Cancel</button> <button id="confirm" type="button">Delete</button>
</div></div>

<script>
$('del').onclick=()=>{$('overlay').hidden=false;$('cancel').focus({preventScroll:true});};
$('cancel').onclick=()=>{$('overlay').hidden=true;$('msg').textContent='Kept Website redesign.';};
$('confirm').onclick=()=>{$('overlay').hidden=true;$('proj').remove();$('empty').hidden=false;$('msg').textContent='Project deleted.';};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)$('cancel').click();});
</script>
</body>
</html>
