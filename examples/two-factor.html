<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two-factor code</title>
<script src="hooks.js"></script>
<link rel="stylesheet" href="site.css">
<style>:root{--accent:#1d4ed8}</style>
</head>
<body>
<h1>Enter your code</h1><p>We sent a 6-digit code to your phone ending in 42.</p>
<label for="code">Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code">
<button id="verify" type="button">Verify</button> <button id="resend" type="button" class="secondary">Resend code</button>
<p id="err" role="alert"></p><p id="ok" class="ok" hidden></p>

<script>
let tries=3;
$('verify').onclick=()=>{const c=$('code').value.trim();$('ok').hidden=true;
  if(!/^[0-9]{6}$/.test(c)){$('err').textContent='The code has 6 digits.';return;}
  if(c==='246810'){$('err').textContent='';$('ok').hidden=false;$('ok').textContent="You're signed in.";$('verify').disabled=true;return;}
  tries--;
  if(tries<=0){$('err').textContent='Too many attempts. Request a new code.';$('verify').disabled=true;return;}
  $('err').textContent="That code isn't right. "+tries+(tries===1?' attempt left.':' attempts left.');};
$('resend').onclick=()=>{tries=3;$('verify').disabled=false;$('err').textContent='';$('ok').hidden=false;$('ok').textContent='New code sent.';};
</script>
</body>
</html>
