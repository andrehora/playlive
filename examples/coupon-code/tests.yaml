test: SAVE10 takes 10% off
steps:
  - fill: { label: Coupon code, value: save10 }
  - click: { role: button, name: Apply }
  - expectText: "Discount: -$6.00"
  - expectText: "Total: $59.00"

test: FREESHIP removes shipping
steps:
  - fill: { label: Coupon code, value: FREESHIP }
  - click: { role: button, name: Apply }
  - expectText: "Shipping: Free"
  - expectText: "Total: $60.00"

test: SUMMER20 has expired and BOGUS is unknown
steps:
  - fill: { label: Coupon code, value: SUMMER20 }
  - click: { role: button, name: Apply }
  - expectText: This code expired on August 31.
  - fill: { label: Coupon code, value: BOGUS }
  - click: { role: button, name: Apply }
  - expectText: "We don't recognize the code BOGUS."
