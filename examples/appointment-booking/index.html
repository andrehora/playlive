<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appointment booking</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#4d7c0f}</style>
</head>
<body>
<h1>Book an appointment</h1>
<label for="who">Clinician</label>
<select id="who"><option>Dr Reis</option><option>Dr Lima</option></select>
<label for="day">Day</label>
<select id="day"><option>Monday</option><option>Tuesday</option></select>
<label class="inline"><input type="checkbox" id="first"> First visit</label>
<div id="slots"></div>
<p id="chosen">No time chosen.</p>
<button id="book" type="button">Confirm booking</button>
<p id="msg" hidden></p>

<script>
const TAKEN={'Dr Reis|Monday':['09:00'],'Dr Lima|Tuesday':['11:00','11:30']};
const TIMES=['09:00','09:30','11:00','11:30'];let pick=null;
function upd(){
  const key=$('who').value+'|'+$('day').value,taken=TAKEN[key]||[];
  $('slots').textContent='';
  const row=document.createElement('div');row.className='row';
  TIMES.forEach(t=>{
    const b=document.createElement('button');b.type='button';b.textContent=t;
    const gone=taken.includes(t);
    b.setAttribute('aria-label',t+(gone?', taken':', free'));
    if(gone) b.disabled=true; else b.onclick=()=>{pick=t;upd();};
    row.appendChild(b);
  });
  $('slots').appendChild(row);
  if(pick&&taken.includes(pick)) pick=null;
  $('chosen').textContent=pick?'Chosen: '+$('day').value+' at '+pick+' with '+$('who').value:'No time chosen.';
}
$('book').onclick=()=>{
  const p=$('msg');p.hidden=false;
  if(!pick){p.className='';p.textContent='Choose a time first.';return;}
  p.className='ok';
  p.textContent='Booked '+$('day').value+' at '+pick+' with '+$('who').value
    +($('first').checked?' · arrive 10 minutes early for a first visit':'');
};
$('who').onchange=upd;$('day').onchange=upd;upd();
</script>
</body>
</html>
