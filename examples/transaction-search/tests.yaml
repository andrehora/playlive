test: Searching narrows the list
steps:
  - expectText: 5 transactions
  - fill: { label: Search, value: coffee }
  - expectText: "Blue Bottle Coffee · -$4.50"
  - expectText: 1 transaction
  - expectNoText: Rent

test: Deposits hide the payments
steps:
  - select: { label: Kind, value: Deposits }
  - expectText: "Payroll · +$2400.00"
  - expectText: "Refund: Headphones · +$89.00"
  - expectNoText: Corner Grocery

test: A search with no match says so
steps:
  - fill: { label: Search, value: sailboat }
  - expectText: No transactions match that search.
  - expectText: 0 transactions
