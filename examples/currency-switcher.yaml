site: currency-switcher

test: Shows dollars by default
steps:
  - expectText: "Total: $57.00"

test: Switches to euros
steps:
  - select: { label: Currency, value: EUR }
  - expectText: Notebook · €11.04
  - expectText: "Total: €52.44"

test: Switches to reais
steps:
  - select: { label: Currency, value: BRL }
  - expectText: "Total: R$285.00"
