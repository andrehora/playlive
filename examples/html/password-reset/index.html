<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password reset</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#1d4ed8}</style>
</head>
<body>
<h1>Reset your password</h1><p>Enter the email you use to sign in.</p>
<label for="em">Email</label><input id="em" type="email">
<button id="send" type="button">Send reset link</button>
<p id="err" role="alert"></p><p id="ok" class="ok" hidden></p>

<script>
let sent=0;
$('send').onclick=()=>{const e=$('em').value.trim();
  if(!/^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(e)){$('err').textContent='Enter the email you signed up with.';return;}
  $('err').textContent='';const b=$('send');b.disabled=true;b.textContent='Sending…';
  setTimeout(()=>{sent++;b.disabled=false;b.textContent='Send again';$('ok').hidden=false;
    $('ok').textContent=sent===1?'If an account exists for '+e+', we sent a reset link.':'We sent another link to '+e+'.';},500);};
</script>
</body>
</html>
