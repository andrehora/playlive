<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Currency switcher</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#0e7490}</style>
</head>
<body>
<h1>Travel shop</h1>
<label for="cur">Currency</label><select id="cur"><option>USD</option><option>EUR</option><option>BRL</option></select>
<ul id="list" class="clean"></ul><p id="total" class="ok"></p>

<script>
const R={USD:[1,'$'],EUR:[0.92,'€'],BRL:[5,'R$']};const P=[['Notebook',12],['Backpack',45]];
const f=(v,c)=>R[c][1]+(v*R[c][0]).toFixed(2);
function upd(){const c=$('cur').value;$('list').innerHTML='';
  P.forEach(([n,p])=>{const li=document.createElement('li');li.textContent=n+' · '+f(p,c);$('list').appendChild(li);});
  $('total').textContent='Total: '+f(57,c);}
$('cur').onchange=upd;upd();
</script>
</body>
</html>
