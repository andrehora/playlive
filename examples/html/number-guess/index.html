<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Number guess</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#9f1239}</style>
</head>
<body>
<h1>Guess the number</h1>
<p>I am thinking of a number between 1 and 50.</p>
<label for="g">Your guess</label>
<input id="g" type="text" placeholder="1 to 50">
<button id="go" type="button">Guess</button>
<button id="again" type="button" class="secondary">Play again</button>
<p id="msg">No guesses yet.</p>
<p id="tries">Guesses: 0</p>

<script>
const SECRET=23;let n=0,won=false;
$('go').onclick=()=>{
  if(won){$('msg').textContent='You already found it. Play again to start over.';return;}
  const v=Number($('g').value.trim());
  if(!$('g').value.trim()||isNaN(v)||v<1||v>50){$('msg').textContent='Enter a whole number from 1 to 50.';return;}
  n++;$('tries').textContent='Guesses: '+n;
  if(v===SECRET){won=true;$('msg').className='ok';$('msg').textContent='Got it in '+n+(n===1?' guess':' guesses')+'.';}
  else{$('msg').className='';$('msg').textContent=v<SECRET?v+' is too low.':v+' is too high.';}
};
$('again').onclick=()=>{n=0;won=false;$('g').value='';$('msg').className='';
  $('msg').textContent='No guesses yet.';$('tries').textContent='Guesses: 0';};
</script>
</body>
</html>
