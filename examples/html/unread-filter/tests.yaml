test: The counter shows what is unread
steps:
  - expectText: "3 messages · 2 unread"

test: Unread hides what you have read
steps:
  - select: { label: Show, value: Unread }
  - expectText: "2 messages · 2 unread"
  - expectNoText: "Standup notes · read"

test: Reading Welcome aboard lowers the count
steps:
  - click: { role: button, name: "Mark read Welcome aboard" }
  - expectText: "3 messages · 1 unread"
  - expectText: "Welcome aboard · read"

test: Starring Standup notes puts it in the starred list
steps:
  - click: { role: button, name: Star Standup notes }
  - select: { label: Show, value: Starred }
  - expectText: "Standup notes · read · starred"
  - expectText: 2 messages
