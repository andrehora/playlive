<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sort results</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#0369a1}</style>
</head>
<body>
<h1>Headphones</h1>
<label for="sort">Sort by</label>
<select id="sort"><option>Relevance</option><option>Price: low to high</option><option>Price: high to low</option><option>Rating</option></select>
<label class="inline"><input type="checkbox" id="stock"> In stock only</label>
<p id="count"></p>
<ul id="list" class="clean"></ul>

<script>
const P=[['Studio Pro',249,4.8,true],['Daily Buds',59,4.1,true],['Trail Clip',89,4.5,false],['Desk Set',129,3.9,true]];
function upd(){
  let rows=P.filter(p=>!$('stock').checked||p[3]);
  const s=$('sort').value;
  if(s==='Price: low to high') rows=[...rows].sort((a,b)=>a[1]-b[1]);
  else if(s==='Price: high to low') rows=[...rows].sort((a,b)=>b[1]-a[1]);
  else if(s==='Rating') rows=[...rows].sort((a,b)=>b[2]-a[2]);
  $('count').textContent=rows.length+' results · sorted by '+s.toLowerCase();
  $('list').textContent='';
  rows.forEach(([n,p,r,st],i)=>{const li=document.createElement('li');
    li.textContent=(i+1)+'. '+n+' · $'+p+' · '+r.toFixed(1)+(st?'':' · out of stock');$('list').appendChild(li);});
}
$('sort').onchange=upd;$('stock').onchange=upd;upd();
</script>
</body>
</html>
