test: A short password is weak
steps:
  - fill: { label: New password, value: abc }
  - expectText: "Strength: Weak"

test: Length and a number make it medium
steps:
  - fill: { label: New password, value: sunflower7 }
  - expectText: "Strength: Medium"
  - expectText: ✓ Contains a number

test: Adding a symbol makes it strong
steps:
  - fill: { label: New password, value: sunflower7! }
  - expectText: "Strength: Strong"
  - expectText: ✓ Contains a symbol
