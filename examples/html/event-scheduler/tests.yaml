test: Adds Team standup on Tuesday
steps:
  - fill: { label: Event title, value: Team standup }
  - select: { label: Day, value: Tuesday }
  - click: { role: button, name: Add event }
  - expectText: Tuesday
  - expectText: "09:00 Team standup"

test: Two events cannot share a slot
steps:
  - fill: { label: Event title, value: Planning }
  - click: { role: button, name: Add event }
  - fill: { label: Event title, value: Retro }
  - click: { role: button, name: Add event }
  - expectText: "Monday at 09:00 is already taken."

test: A title is required
steps:
  - click: { role: button, name: Add event }
  - expectText: Give the event a title.
