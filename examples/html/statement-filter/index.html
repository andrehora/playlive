<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statement filter</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#a16207}</style>
</head>
<body>
<h1>Statements</h1>
<label for="month">Month</label>
<select id="month"><option>March</option><option>April</option></select>
<label class="inline"><input type="checkbox" id="dep"> Only deposits</label>
<ul id="list" class="clean"></ul>
<p id="total" class="ok"></p>

<script>
const S={March:[['Payroll',2400],['Rent',-1200],['Groceries',-180]],
         April:[['Payroll',2400],['Rent',-1200],['Bonus',500]]};
function upd(){
  const rows=S[$('month').value].filter(([,a])=>!$('dep').checked||a>0);
  $('list').textContent='';
  rows.forEach(([n,a])=>{const li=document.createElement('li');
    li.textContent=n+' · '+(a<0?'-$':'+$')+Math.abs(a).toFixed(2);$('list').appendChild(li);});
  const t=rows.reduce((s,[,a])=>s+a,0);
  $('total').textContent='Net for '+$('month').value+': '+(t<0?'-$':'+$')+Math.abs(t).toFixed(2);
}
$('month').onchange=upd;$('dep').onchange=upd;upd();
</script>
</body>
</html>
