<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unit converter</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#0e7490}</style>
</head>
<body>
<h1>Unit converter</h1>
<label for="kind">Conversion</label><select id="kind"><option>Kilometers to miles</option><option>Celsius to Fahrenheit</option><option>Kilograms to pounds</option></select>
<label for="val">Value</label><input id="val" inputmode="decimal">
<p id="out" aria-live="polite">Enter a value to convert.</p>

<script>
const K={'Kilometers to miles':[v=>v*0.621371,'km','mi'],'Celsius to Fahrenheit':[v=>v*9/5+32,'°C','°F'],'Kilograms to pounds':[v=>v*2.20462,'kg','lb']};
function upd(){const raw=$('val').value.trim(),k=K[$('kind').value];
  if(!raw){$('out').textContent='Enter a value to convert.';return;}
  const v=Number(raw);if(isNaN(v)){$('out').textContent='Enter a number, like 12.5';return;}
  $('out').textContent=raw+' '+k[1]+' = '+k[0](v).toFixed(2)+' '+k[2];}
$('val').addEventListener('input',upd);$('kind').addEventListener('change',upd);
</script>
</body>
</html>
