site: table-booking

test: Books a table
steps:
  - select: { label: Time, value: "19:30" }
  - fill: { label: Guests, value: 4 }
  - click: { role: button, name: Book table }
  - expectText: "Table for 4 on Friday at 19:30 is booked."

test: Saturday evening is fully booked
steps:
  - select: { label: Day, value: Saturday }
  - select: { label: Time, value: "19:30" }
  - click: { role: button, name: Book table }
  - expectText: "Saturday at 19:30 is fully booked."

test: Large groups are asked to call
steps:
  - fill: { label: Guests, value: 12 }
  - click: { role: button, name: Book table }
  - expectText: For more than 8 guests, please call us.
