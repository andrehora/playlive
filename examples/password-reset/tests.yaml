site: password-reset

flows:
  request:
    - fill: { label: Email, value: ana@example.test }
    - click: { role: button, name: Send reset link }

test: Sends a reset link
steps:
  - use: request
  - expectText: If an account exists for ana@example.test, we sent a reset link.

test: Can send the link again
steps:
  - use: request
  - click: { role: button, name: Send again }
  - expectText: We sent another link to ana@example.test.

test: Rejects an invalid email
steps:
  - fill: { label: Email, value: ana@ }
  - click: { role: button, name: Send reset link }
  - expectText: Enter the email you signed up with.
