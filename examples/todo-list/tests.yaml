test: Empty task shows an error
steps:
  - click: { role: button, name: Add task }
  - expectText: Write a task first.

test: Complete one of two tasks
steps:
  - fill: { placeholder: What needs doing?, value: Buy milk }
  - click: { role: button, name: Add task }
  - fill: { placeholder: What needs doing?, value: Call the bank }
  - click: { role: button, name: Add task }
  - check: { label: Buy milk }
  - expectText: 1 of 2 done

test: Works through a list of two tasks
steps:
  - fill: { placeholder: What needs doing?, value: Buy bread }
  - click: { role: button, name: Add task }
  - expectText: 0 of 1 done
  - fill: { placeholder: What needs doing?, value: Call the dentist }
  - click: { role: button, name: Add task }
  - expectText: 0 of 2 done
  - check: { label: Buy bread }
  - expectText: 1 of 2 done
  - check: { label: Call the dentist }
  - expectText: 2 of 2 done
