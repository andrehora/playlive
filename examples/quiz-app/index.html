<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz</title>
<script src="../hooks.js"></script>
<link rel="stylesheet" href="../site.css">
<style>:root{--accent:#0e7490}</style>
</head>
<body>
<h1>Science quiz</h1>
<fieldset><legend>1. What is the largest planet?</legend>
<label class="inline"><input type="radio" name="q1" value="Jupiter"> Jupiter</label><label class="inline"><input type="radio" name="q1" value="Mars"> Mars</label><label class="inline"><input type="radio" name="q1" value="Venus"> Venus</label></fieldset>
<fieldset><legend>2. How many continents are there?</legend>
<label class="inline"><input type="radio" name="q2" value="Five"> Five</label><label class="inline"><input type="radio" name="q2" value="Six"> Six</label><label class="inline"><input type="radio" name="q2" value="Seven"> Seven</label></fieldset>
<fieldset><legend>3. Which gas do plants absorb?</legend>
<label class="inline"><input type="radio" name="q3" value="Oxygen"> Oxygen</label><label class="inline"><input type="radio" name="q3" value="Carbon dioxide"> Carbon dioxide</label><label class="inline"><input type="radio" name="q3" value="Nitrogen"> Nitrogen</label></fieldset>
<button id="submit" type="button">Submit answers</button> <button id="again" type="button" class="secondary" hidden>Try again</button>
<p id="res" role="status"></p>

<script>
const ans=['Jupiter','Seven','Carbon dioxide'];
$('submit').onclick=()=>{const picked=['q1','q2','q3'].map(q=>document.querySelector('input[name='+q+']:checked'));
  if(picked.some(p=>!p)){$('res').textContent='Answer all 3 questions first.';return;}
  const score=picked.filter((p,i)=>p.value===ans[i]).length;
  $('res').textContent='You scored '+score+' of 3'+(score===3?' · Perfect!':'');$('again').hidden=false;$('submit').disabled=true;};
$('again').onclick=()=>{document.querySelectorAll('input').forEach(i=>{i.checked=false;});$('res').textContent='';$('again').hidden=true;$('submit').disabled=false;};
</script>
</body>
</html>
