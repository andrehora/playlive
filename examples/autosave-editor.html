<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autosave draft</title>
<script src="hooks.js"></script>
<link rel="stylesheet" href="site.css">
<style>:root{--accent:#4d7c0f}</style>
</head>
<body>
<h1>Draft</h1>
<label for="d">Message draft</label><textarea id="d"></textarea>
<p id="status" role="status">No draft yet</p>
<button id="discard" type="button" class="secondary">Discard draft</button>

<script>
let timer;
$('d').addEventListener('input',()=>{$('status').textContent='Saving…';clearTimeout(timer);
  timer=setTimeout(()=>{const w=$('d').value.trim().split(/ +/).filter(Boolean).length;
    $('status').textContent=w?'Draft stored · '+w+(w===1?' word':' words'):'No draft yet';},700);});
$('discard').onclick=()=>{clearTimeout(timer);$('d').value='';$('status').textContent='Draft discarded';};
</script>
</body>
</html>
