test: Labelling a message says so
steps:
  - select: { label: Message, value: "Invoice #4821" }
  - select: { label: Label, value: Billing }
  - click: { role: button, name: Apply label }
  - expectText: "Invoice #4821 labelled Billing."
  - expectText: "Invoice #4821 · Billing"

test: Filtering shows only that label
steps:
  - select: { label: Message, value: Standup notes }
  - select: { label: Label, value: Team }
  - click: { role: button, name: Apply label }
  - select: { label: Show, value: Team }
  - expectText: "Standup notes · Team"
  - expectNoText: "Invoice #4821 · no label"

test: A label with nothing on it says so
steps:
  - select: { label: Show, value: Personal }
  - expectText: Nothing labelled Personal.
