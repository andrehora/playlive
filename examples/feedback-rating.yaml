site: feedback-rating

test: Sends a 4-star rating with a comment
steps:
  - click: { role: button, name: Rate 4 stars }
  - expectText: You chose 4 of 5
  - fill: { label: Comment (optional), value: "Fast delivery, great packaging" }
  - click: { role: button, name: Send feedback }
  - expectText: Thanks for your 4-star feedback!

test: A rating is required
steps:
  - click: { role: button, name: Send feedback }
  - expectText: Choose a rating first.
