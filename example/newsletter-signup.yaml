site: newsletter-signup

test: Subscribes with consent
steps:
  - fill: { label: Email address }
    value: ana@example.test
  - check: { label: I agree to receive emails }
  - click: { role: button, name: Subscribe }
  - expectText: Check your inbox to confirm ana@example.test.

test: Consent is required
steps:
  - fill: { label: Email address }
    value: ana@example.test
  - click: { role: button, name: Subscribe }
  - expectText: Please agree to receive emails.

test: Rejects an invalid email
steps:
  - fill: { label: Email address }
    value: not-an-email
  - click: { role: button, name: Subscribe }
  - expectText: Enter a valid email address.
