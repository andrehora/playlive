site: city-search

test: Suggests matching cities
steps:
  - fill: { label: Destination }
    value: par
  - expectText: 3 suggestions
  - expectVisible: { role: option, name: Parma }

test: Picking a suggestion shows flights
steps:
  - fill: { label: Destination }
    value: par
  - click: { role: option, name: Paris }
  - expectText: Flights to Paris from $129

test: Explains when nothing matches
steps:
  - fill: { label: Destination }
    value: xyz
  - expectText: No cities match “xyz”
