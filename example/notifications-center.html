<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="hooks.js"></script>
<link rel="stylesheet" href="site.css">
<style>:root{--accent:#4d7c0f}</style>
</head>
<body>
<h1>Notifications</h1><p id="unread"></p>
<div class="row"><button id="all" type="button" class="secondary">Mark all as read</button><button id="clear" type="button" class="secondary">Clear all</button></div>
<div id="list"></div>

<script>
const N=[['Ana commented on your post','2 min ago'],['Your export is ready','1 hour ago'],['Ben invited you to Design team','Yesterday']].map(x=>({t:x[0],w:x[1],read:false}));
function render(){$('list').innerHTML='';
  N.forEach(n=>{const d=document.createElement('div');d.className='card';d.style.opacity=n.read?'.6':'1';const p=document.createElement('p');p.textContent=(n.read?'':'● ')+n.t+' · '+n.w;d.appendChild(p);
    if(!n.read){const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='Mark as read';b.setAttribute('aria-label','Mark as read: '+n.t);b.onclick=()=>{n.read=true;render();};d.appendChild(b);}
    $('list').appendChild(d);});
  const u=N.filter(n=>!n.read).length;$('unread').textContent=!N.length?"You're all caught up.":u?u+' unread':'No unread notifications';$('all').disabled=!u;}
$('all').onclick=()=>{N.forEach(n=>{n.read=true;});render();};$('clear').onclick=()=>{N.length=0;render();};render();
</script>
</body>
</html>
