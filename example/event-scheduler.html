<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event scheduler</title>
<script src="hooks.js"></script>
<link rel="stylesheet" href="site.css">
<style>:root{--accent:#7c3aed}</style>
</head>
<body>
<h1>Team schedule</h1>
<label for="title">Event title</label><input id="title">
<label for="day">Day</label><select id="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select>
<label for="time">Time</label><select id="time"><option>09:00</option><option>13:00</option><option>16:00</option></select>
<button id="add" type="button">Add event</button><p id="err" role="alert"></p>
<div id="sched"><p>No events this week.</p></div>

<script>
const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const ev=[];
function render(){const s=$('sched');s.innerHTML='';if(!ev.length){s.innerHTML='<p>No events this week.</p>';return;}
  days.forEach(d=>{const mine=ev.filter(e=>e.d===d).sort((a,b)=>a.t.localeCompare(b.t));if(!mine.length)return;
    const h=document.createElement('h2');h.textContent=d;s.appendChild(h);
    mine.forEach(e=>{const p=document.createElement('p');p.textContent=e.t+' '+e.title;s.appendChild(p);});});}
$('add').onclick=()=>{const title=$('title').value.trim(),d=$('day').value,t=$('time').value;
  if(!title){$('err').textContent='Give the event a title.';return;}
  if(ev.some(e=>e.d===d&&e.t===t)){$('err').textContent=d+' at '+t+' is already taken.';return;}
  $('err').textContent='';ev.push({title:title,d:d,t:t});$('title').value='';render();};
</script>
</body>
</html>
